version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - MAX_UPLOAD_MB=15
      - LOG_LEVEL=INFO
      - MODEL_PREWARM=1
      - CORS_ALLOW_ORIGINS=*
    volumes:
      - shared_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info -Q rembg --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
    volumes:
      - shared_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  shared_data:
